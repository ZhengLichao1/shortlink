server:
  port: 8080

spring:
  profiles:
    active: local
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3307/shortlink?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD}
  data:
    redis:
      host: localhost
      port: 6379
      database: 0

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

app:
  domain: http://localhost:8080

# 两级缓存与布隆过滤器配置
# 压测时改这两个开关做三组对比：
#   l1=false l2=false → 直连 MySQL
#   l1=false l2=true  → 单级 Redis
#   l1=true  l2=true  → Caffeine + Redis
shortlink:
  cache:
    l1-enabled: true
    l2-enabled: true
    l1-max-size: 10000
    # L1 故意比 L2 短：本地缓存没有失效通知，多实例下只能等它自己过期
    l1-ttl-seconds: 10
    bloom-expected-insertions: 100000
    bloom-false-positive-rate: 0.01
